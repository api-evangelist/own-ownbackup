name: Own (OwnBackup)
description: 'Own (formerly OwnBackup, now Own from Salesforce) is a SaaS data protection platform that provides
  backup, recovery, archiving, sandbox seeding, and data security and compliance for cloud applications including
  Salesforce, Microsoft Dynamics 365, and ServiceNow. Founded in 2015 and acquired by Salesforce in 2024, Own helps
  organizations protect and manage the data held in their business-critical SaaS systems against loss, corruption,
  and compliance risk. Own is delivered as a managed product rather than a public developer API platform: it operates
  a public system status page and a trust center listing its security certifications (SOC 2, ISO 27001/27701, FedRAMP,
  HDS, GDPR, HIPAA/HITECH) and a published vulnerability disclosure policy, but does not currently publish an open,
  self-serve REST/OpenAPI developer surface.'
